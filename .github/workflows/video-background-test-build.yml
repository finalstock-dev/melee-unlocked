name: Video background test build

on:
  workflow_dispatch:
  push:
    branches: [feature/menu-video-backgrounds]
  pull_request:
    branches: [main]

jobs:
  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore generated NTSC 1.02 translation
        shell: pwsh
        run: |
          Copy-Item port/generated.before-0563 port/generated -Recurse
          New-Item -ItemType Junction -Path melee -Target (Resolve-Path sourceport/extern/melee) | Out-Null
          # The public tree has Streamline headers/import libs but not NVIDIA's redistributable DLLs.
          # Keep this standalone test package honest instead of failing in the post-build copy step.
          Rename-Item port/third_party/streamline/include/sl.h sl.h.ci-disabled
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-video -G "Visual Studio 17 2022" -A x64 -DMELEE_BUILD_EXPERIMENTAL_PORT=ON
      - name: Build game and tests
        shell: pwsh
        run: cmake --build build-video --config Release --target melee_port --parallel
      - name: Run available validation
        shell: pwsh
        run: |
          ctest --test-dir build-video -C Release -R '^port_dol_validation$' --output-on-failure
          if (-not (Test-Path build-video/port/Release/melee_port.exe)) {
            throw 'melee_port.exe was not produced'
          }
      - name: Package test executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build-video/port/Release/melee_port.exe artifact/
          Set-Content artifact/README.txt @'
          Put melee_port.exe into your existing Melee Unlocked test folder.
          Open F1 > Video > Animated menu backgrounds > Open folder.
          Add H.264 MP4 files named css.mp4 and/or sss.mp4, then visit each screen.
          This CI test package omits optional DLSS/XeSS vendor runtimes that are not in the public repository.
          Keep your clean NTSC 1.02 ISO local. This artifact contains no game data.
          '@
      - uses: actions/upload-artifact@v4
        with:
          name: melee-unlocked-video-background-test
          path: artifact
          if-no-files-found: error
